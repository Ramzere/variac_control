# =============================================================================
# Variac Control System — Configuration File
# =============================================================================
# Edit this file with Notepad++ (Windows) or any plain text editor.
# Always save as UTF-8 without BOM.
# Restart the server after any change for it to take effect.
# =============================================================================

# ── Web server ────────────────────────────────────────────────────────────────
[server]
# IP address the server listens on — 0.0.0.0 means all network interfaces
host = 0.0.0.0
# Port for the web interface — open http://localhost:5001 in your browser
port = 5001

# ── Project paths ─────────────────────────────────────────────────────────────
[paths]
# Absolute path to the variac_control folder on this machine
# Windows example: C:\Users\YourName\Documents\variac_control
# macOS example:   /Users/yourname/Documents/variac_control
app_dir = C:\Users\Rahul.Samyal\Documents\variac_control

# ── Arduino serial connection ─────────────────────────────────────────────────
[arduino]
# Serial port for the Arduino Nano CH340
# Windows: check Device Manager -> Ports (COM & LPT) -> USB-SERIAL CH340
# macOS:   typically /dev/tty.usbserial-XXXX
port = COM5
# Communication speed — must match the value in Control_Microwave.ino (Serial.begin)
baudrate = 9600
# Serial read timeout in seconds
timeout = 2

# ── PID temperature controller ────────────────────────────────────────────────
[pid]
# Proportional gain — corrects the instantaneous error
p = 1.2
# Integral gain — corrects accumulated error over time
i = 0.05
# Derivative gain — anticipates the rate of change (0 = disabled)
d = 0.0
# Bang-bang threshold in degrees C — if |error| > this value, the motor runs
# at full speed toward the target instead of using PID (faster initial ramp-up)
bangbang_threshold = 20

# ── Sensor A — CalexConfig pyrometer ─────────────────────────────────────────
[sensor_1]
# Display name shown in the web interface header dropdown
name = Sensor A — Low range
# Measurement range in degrees C (used to set slider and chart limits)
min_temp = 0
max_temp = 800
# Data source: csv = reads the most recent CSV file from csv_dir_1
format = csv

# ── Sensor B — Optris CT 3MH pyrometer ───────────────────────────────────────
[sensor_2]
# Display name shown in the web interface header dropdown
name = Sensor B — High range
# Measurement range in degrees C
min_temp = 250
max_temp = 1800
# Data source: serial = reads directly from COM7 via binary protocol
format = csv

# ── Optris serial connection (Sensor B only) ──────────────────────────────────
[optris]
# Serial port for the Optris CT 3MH pyrometer (USB virtual COM port)
# IMPORTANT: CompactConnect must be closed before the server connects
# Only one application can use this port at a time
port = COM7
# Baud rate — must match the value shown in CompactConnect Setup Interface
baudrate = 115200

# ── CalexConfig CSV data (Sensor A only) ─────────────────────────────────────
[sensor_csv]
# Folder where CalexConfig saves its CSV log files
# The server always reads the most recently modified .csv file in this folder
csv_dir_1 = C:\Users\Rahul.Samyal\OneDrive - University of Limerick\Research\Documents\CalexConfig log files
# Column index (0-based) containing the temperature value to read
# 2 = Unfiltered Temperature, 3 = Filtered Temperature (recommended), 4 = Sensor Temperature
column_1 = 3
